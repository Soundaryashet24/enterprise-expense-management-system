spring.datasource.url=jdbc:mysql://localhost:3306/expense_management_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.security.username=${API_USERNAME}
app.security.password=${API_PASSWORD}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Demo accounts (development only)
app.auth.employee.username=${EMPLOYEE_USERNAME}
app.auth.employee.password=${EMPLOYEE_PASSWORD}
app.auth.employee.id=${EMPLOYEE_ID}

app.auth.manager.username=${MANAGER_USERNAME}
app.auth.manager.password=${MANAGER_PASSWORD}
app.auth.manager.id=${MANAGER_ID}